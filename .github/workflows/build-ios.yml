name: Build iOS App

on:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_STORE_PATH: ~/.pnpm-store

      - name: Build SvelteKit
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build .app bundle
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build

      - name: Rename and zip .app
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator/
          mv App.app Bronify.app
          zip -r Bronify.app.zip Bronify.app

      - name: Upload .app to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ios/App/build/Build/Products/Debug-iphonesimulator/Bronify.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

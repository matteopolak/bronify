name: Build Android App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_STORE_PATH: ~/.pnpm-store

      - name: Build SvelteKit
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode keystore from GitHub secret
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/bronify.keystore
        shell: bash

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: bronify.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: print out files
        run: |
          ls -la android/app/build/outputs
          ls -la android/app/build/outputs/apk
          ls -la android/app/build/outputs/apk/release

      - name: Rename and upload final APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/bronify.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bronify-apk
          path: android/app/build/outputs/apk/release/bronify.apk

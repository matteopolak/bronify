name: Build Android App

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_STORE_PATH: ~/.pnpm-store

      - name: Build SvelteKit
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode keystore from GitHub secret
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/bronify.keystore
        shell: bash

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: bronify.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename and upload final APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/bronify.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/bronify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
